<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chatcom</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Mono:wght@300;400&display=swap"
        rel="stylesheet" />
    <style>
        :root {
            --ink: #1a1a2e;
            --paper: #f5f0e8;
            --cream: #ede8dc;
            --accent: #8b5e3c;
            --accent-lt: #c49a6c;
            --muted: #9a8f82;
            --border: rgba(139, 94, 60, .18);
            --red: #ef4444;
            --green: #7cba7c;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Cormorant Garamond', Georgia, serif;
            background: var(--paper);
            color: var(--ink);
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }

        /* ── Page loader (initial load) ── */
        #page-loader {
            position: fixed; inset: 0; z-index: 300;
            background: var(--paper);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 14px;
            transition: opacity .35s ease;
        }
        #page-loader.hidden { opacity: 0; pointer-events: none; }
        .loader-spinner {
            width: 34px; height: 34px;
            border: 2px solid var(--border);
            border-top-color: var(--accent-lt);
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loader-text {
            font-family: 'DM Mono', monospace; font-size: .72rem;
            letter-spacing: .14em; text-transform: uppercase;
            color: var(--muted);
        }

        /* ── Header ── */
        header { width: 100%; max-width: 520px; padding: 28px 28px 18px; display: flex; align-items: baseline; gap: 12px; border-bottom: 1px solid var(--border); }
        header h1 { font-size: 2rem; font-weight: 300; letter-spacing: .04em; color: var(--accent); }
        header span { font-family: 'DM Mono', monospace; font-size: .7rem; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; }
        .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); margin-left: auto; flex-shrink: 0; box-shadow: 0 0 0 3px rgba(124,186,124,.2); }
        #back-btn { margin-left: 12px; background: none; border: none; cursor: pointer; font-family: 'DM Mono', monospace; font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); transition: color .2s; }
        #back-btn:hover { color: var(--accent); }

        /* ── Portrait ── */
        #portrait-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
        .portrait-frame { position: relative; }
        .ring { border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .ring-outer { width: 260px; height: 260px; border: 2px solid var(--border); transition: border-color .3s; }
        .ring-outer.speaking { border-color: var(--accent-lt); animation: speakring 1.6s ease infinite; }
        @keyframes speakring { 0%,100% { box-shadow: 0 0 0 0 rgba(196,154,108,.4); } 50% { box-shadow: 0 0 0 14px rgba(196,154,108,0); } }
        .ring-inner { width: 240px; height: 240px; background: var(--cream); border: 1px solid var(--border); overflow: hidden; }
        .ring-inner img { width: 100%; height: 100%; object-fit: cover; object-position: center top; display: block; }

        #thinking-overlay { display: none; position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); gap: 6px; align-items: center; }
        #thinking-overlay.show { display: flex; }
        .tdot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent-lt); animation: bounce .9s ease infinite; }
        .tdot:nth-child(2) { animation-delay: .15s; }
        .tdot:nth-child(3) { animation-delay: .30s; }
        @keyframes bounce { 0%,80%,100% { transform: translateY(0); } 40% { transform: translateY(-5px); } }

        #status-label { font-family: 'DM Mono', monospace; font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); min-height: 1.2em; transition: color .3s; }
        #status-label.active { color: var(--accent-lt); }
        #interim { font-family: 'Cormorant Garamond', serif; font-size: .95rem; font-style: italic; color: var(--muted); min-height: 1.4em; max-width: 400px; text-align: center; opacity: 0; transition: opacity .2s; }
        #interim.show { opacity: 1; }

        /* ── Input bar ── */
        #input-bar { width: 100%; max-width: 520px; padding: 16px 28px 28px; display: flex; gap: 10px; align-items: center; border-top: 1px solid var(--border); background: var(--paper); }
        #user-input { flex: 1; font-family: 'Cormorant Garamond', serif; font-size: 1.05rem; background: var(--cream); border: 1.5px solid var(--border); border-radius: 40px; padding: 10px 20px; outline: none; color: var(--ink); transition: border-color .2s; }
        #user-input::placeholder { color: var(--muted); }
        #user-input:focus { border-color: var(--accent-lt); }

        .btn-icon { width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--border); background: var(--cream); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .2s, border-color .2s, transform .1s; flex-shrink: 0; }
        .btn-icon:hover { background: #dde8f5; border-color: var(--accent-lt); }
        .btn-icon:active { transform: scale(.93); }
        .btn-icon svg { pointer-events: none; }
        .btn-icon:disabled { opacity: .4; cursor: default; }
        #mic-btn.in-call { background: #fee2e2; border-color: var(--red); animation: callpulse 1.4s ease infinite; }
        @keyframes callpulse { 0%,100% { box-shadow: 0 0 0 0 rgba(239,68,68,.35); } 50% { box-shadow: 0 0 0 9px rgba(239,68,68,0); } }

        /* ── Toast ── */
        #toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #3b0a0a; color: #fecaca; font-family: 'DM Mono', monospace; font-size: .75rem; padding: 8px 20px; border-radius: 8px; opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 200; }
        #toast.show { opacity: 1; }

        /* ── Overlay pages ── */
        .overlay-page {
            position: fixed; inset: 0; z-index: 100;
            background: var(--paper);
            display: flex; flex-direction: column;
            align-items: center; justify-content: flex-start;
            padding: 40px 28px;
            overflow-y: auto;
            animation: fadeIn .5s ease both;
        }
        .overlay-page.hidden { animation: fadeOut .4s ease both; pointer-events: none; }
        @keyframes fadeIn  { from { opacity:0; transform:translateY(12px);  } to { opacity:1; transform:translateY(0); } }
        @keyframes fadeOut { from { opacity:1; transform:translateY(0);      } to { opacity:0; transform:translateY(-12px); } }

        /* centre the fiche pages that have little content */
        #patient-page, #choice-page { justify-content: center; }

        /* ── Fiche ── */
        .fiche { max-width: 480px; width: 100%; background: var(--cream); border: 1px solid var(--border); border-radius: 12px; padding: 36px 40px; box-shadow: 0 8px 40px rgba(26,26,46,.08); }
        .fiche-header { margin-bottom: 28px; border-bottom: 1px solid var(--border); padding-bottom: 18px; }
        .fiche-tag { font-family: 'DM Mono', monospace; font-size: .65rem; letter-spacing: .16em; text-transform: uppercase; color: var(--accent-lt); margin-bottom: 8px; }
        .fiche-title { font-size: 1.8rem; font-weight: 300; letter-spacing: .03em; color: var(--accent); line-height: 1.2; }
        .fiche-section { margin-bottom: 22px; }
        .fiche-section:last-of-type { margin-bottom: 0; }
        .fiche-section-title { font-family: 'DM Mono', monospace; font-size: .68rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
        .fiche-section p { font-size: 1.05rem; font-weight: 300; line-height: 1.7; color: var(--ink); }
        .fiche-section ul { list-style: none; padding: 0; margin: 0; }
        .fiche-section ul li { font-size: 1.05rem; font-weight: 300; line-height: 1.7; color: var(--ink); padding-left: 16px; position: relative; margin-bottom: 6px; }
        .fiche-section ul li::before { content: "—"; position: absolute; left: 0; color: var(--accent-lt); }

        /* ── CTA buttons ── */
        .cta-btn { margin-top: 16px; width: 100%; max-width: 480px; padding: 14px 0; font-family: 'Cormorant Garamond', serif; font-size: 1.1rem; font-weight: 300; letter-spacing: .06em; background: var(--accent); color: var(--paper); border: none; border-radius: 40px; cursor: pointer; transition: background .2s, transform .1s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .cta-btn:hover { background: var(--accent-lt); }
        .cta-btn:active { transform: scale(.98); }
        .cta-btn:disabled { opacity: .5; cursor: default; }
        .cta-btn.secondary { background: var(--cream); color: var(--accent); border: 1.5px solid var(--border); }
        .cta-btn.secondary:hover { background: #e8e0d4; }

        .btn-row { display: flex; gap: 10px; width: 100%; max-width: 480px; flex-wrap: wrap; }
        .btn-row .cta-btn { margin-top: 16px; flex: 1; min-width: 120px; }

        /* ── Small inline spinner for buttons ── */
        .btn-spinner {
            width: 14px; height: 14px;
            border: 2px solid rgba(255,255,255,.4);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .7s linear infinite;
            display: none;
        }
        .btn-spinner.show { display: inline-block; }

        /* ── Interview choice ── */
        .interview-grid { display: flex; flex-direction: column; gap: 14px; margin-top: 8px; }
        .interview-btn { width: 100%; padding: 18px 24px; background: var(--cream); border: 1.5px solid var(--border); border-radius: 12px; cursor: pointer; text-align: left; transition: border-color .2s, box-shadow .2s, transform .1s; }
        .interview-btn:hover { border-color: var(--accent-lt); box-shadow: 0 4px 20px rgba(139,94,60,.12); }
        .interview-btn:active { transform: scale(.98); }
        .interview-btn.selected { border-color: var(--accent); background: #f0e8de; }
        .interview-btn .ib-label { font-family: 'Cormorant Garamond', serif; font-size: 1.15rem; font-weight: 400; color: var(--accent); display: block; }

        #choice-error { font-family: 'DM Mono', monospace; font-size: .72rem; color: var(--red); letter-spacing: .08em; min-height: 1.2em; margin-top: 12px; text-align: center; }
        #start-loading { font-family: 'DM Mono', monospace; font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--accent-lt); margin-top: 14px; text-align: center; display: none; }

        /* ── Transcript ── */
        #transcript-box {
            font-family: 'DM Mono', monospace; font-size: .75rem; line-height: 1.8;
            color: var(--ink); background: var(--paper);
            border: 1px solid var(--border); border-radius: 8px;
            padding: 16px; margin-top: 16px;
            max-height: 300px; overflow-y: auto;
            white-space: pre-wrap; word-break: break-word;
        }

        /* ── Evaluation ── */
        #eval-card { display: none; max-width: 480px; width: 100%; margin-top: 20px; margin-bottom: 40px; }
        #eval-feedback {
            font-family: 'Cormorant Garamond', serif; font-size: 1rem;
            line-height: 1.8; color: var(--ink);
            white-space: pre-wrap; word-break: break-word;
        }
        #eval-loading {
            display: none; font-family: 'DM Mono', monospace; font-size: .72rem;
            letter-spacing: .12em; text-transform: uppercase;
            color: var(--accent-lt); margin-top: 14px; text-align: center;
        }
    </style>
</head>

<body>

    <!-- Initial page loader (shown until /modules has loaded) -->
    <div id="page-loader">
        <div class="loader-spinner"></div>
        <div class="loader-text">Chargement…</div>
    </div>

    <!-- Step 1: Interview type -->
    <div id="choice-page" class="overlay-page" style="display:none">
        <div class="fiche">
            <div class="fiche-header">
                <div class="fiche-tag">Type d'entretien</div>
                <div class="fiche-title">Choisissez une approche</div>
            </div>
            <div class="fiche-section">
                <div class="interview-grid" id="interview-grid">
                    <div style="font-family:'DM Mono',monospace;font-size:.72rem;color:var(--muted)">Chargement…</div>
                </div>
                <div id="choice-error"></div>
            </div>
        </div>
        <button class="cta-btn" id="next-btn">
            <span id="next-btn-label">Voir la fiche patient →</span>
            <span class="btn-spinner" id="next-btn-spinner"></span>
        </button>
    </div>

    <!-- Step 2: Fiche patiente (dynamique selon le module choisi) -->
    <div id="patient-page" class="overlay-page" style="display:none">
        <div class="fiche" id="patient-fiche-content">
            <!-- rempli dynamiquement en JS -->
        </div>
        <div id="start-loading">Préparation en cours…</div>
        <button class="cta-btn" id="start-btn">Commencer la consultation →</button>
    </div>

    <!-- Step 3: Transcript + evaluation -->
    <div id="transcript-page" class="overlay-page" style="display:none">
        <div class="fiche">
            <div class="fiche-header">
                <div class="fiche-tag">Fin de consultation</div>
                <div class="fiche-title">Transcript</div>
            </div>
            <div class="fiche-section">
                <div class="fiche-section-title">Historique de l'entretien</div>
                <div id="transcript-box"></div>
            </div>
        </div>

        <div class="btn-row">
            <button class="cta-btn secondary" id="download-btn">⬇ Télécharger</button>
            <button class="cta-btn secondary" id="evaluate-btn">★ Évaluer</button>
            <button class="cta-btn" id="restart-btn">Nouvelle consultation →</button>
        </div>

        <div id="eval-loading">Évaluation en cours…</div>

        <div id="eval-card">
            <div class="fiche">
                <div class="fiche-header">
                    <div class="fiche-tag">Évaluation automatique</div>
                    <div class="fiche-title">Feedback</div>
                </div>
                <div class="fiche-section">
                    <div id="eval-feedback"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Chat UI -->
    <header>
        <h1 id="patient-header-name">Chatcom</h1>
        <span>FR</span>
        <div class="status-dot"></div>
        <button id="back-btn">← retour</button>
    </header>

    <div id="portrait-wrap">
        <div class="portrait-frame">
            <div class="ring ring-outer" id="ring-outer">
                <div class="ring ring-inner">
                    <img id="patient-portrait" src="/static/valerie.jpg" alt="" />
                </div>
            </div>
            <div id="thinking-overlay">
                <span class="tdot"></span><span class="tdot"></span><span class="tdot"></span>
            </div>
        </div>
        <div id="status-label">en attente</div>
        <div id="interim"></div>
    </div>

    <div id="input-bar">
        <button class="btn-icon" id="mic-btn" title="Appel en direct">
            <svg id="icon-call" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.08 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3 1.18h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.09 8.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z" />
            </svg>
            <svg id="icon-endcall" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.08 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3 1.18h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.09 8.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z" />
                <line x1="1" y1="1" x2="23" y2="23" stroke="var(--red)" stroke-width="1.8" />
            </svg>
        </button>

        <input type="text" id="user-input" placeholder="Écrivez un message…" autocomplete="off" />

        <button class="btn-icon" id="send-btn" title="Envoyer">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13" />
                <polygon points="22 2 15 22 11 13 2 9 22 2" />
            </svg>
        </button>
    </div>

    <div id="toast"></div>

    <script>
        /* ── Session ── */
        const SESSION_ID = crypto.randomUUID();
        let selectedInterviewType = null;
        let lastTranscriptText    = "";

        /* ── Patient fiches (dynamic, keyed by interview_type) ── */
        const PATIENT_FICHES = {
            agressif: {
                name: "Valérie Decocq",
                portrait: "/static/valerie.jpg",
                html: `
                    <div class="fiche-header">
                        <div class="fiche-tag">Fiche Patiente</div>
                        <div class="fiche-title">Valérie Decocq</div>
                    </div>
                    <div class="fiche-section">
                        <div class="fiche-section-title">Identité &amp; Contexte</div>
                        <p>40 ans, mère de 2 enfants (2 et 6 ans), en couple.<br />Responsable de communication.</p>
                    </div>
                    <div class="fiche-section">
                        <div class="fiche-section-title">Motif de consultation</div>
                        <p>Douleurs diffuses chroniques depuis 3 mois.<br />Examens normaux (radios, bilans).</p>
                    </div>
                    <div class="fiche-section">
                        <div class="fiche-section-title">Parcours médical</div>
                        <p style="margin-bottom:8px">Traitements essayés :</p>
                        <ul>
                            <li>Antidouleurs / anti-inflammatoires</li>
                            <li>Modifications alimentaires</li>
                        </ul>
                    </div>
                `
            },
            motivational: {
                name: "Isabelle Dupont",
                portrait: "/static/isabelle.jpg",
                html: `
                    <div class="fiche-header">
                        <div class="fiche-tag">Fiche Patiente</div>
                        <div class="fiche-title">Isabelle Dupont</div>
                    </div>
                    <div class="fiche-section">
                        <div class="fiche-section-title">Identité &amp; Contexte</div>
                        <p>45 ans, mariée, mère de trois garçons (18, 16 et 13 ans).<br />Décoratrice d'intérieur indépendante, gérante de son propre magasin.</p>
                    </div>
                    <div class="fiche-section">
                        <div class="fiche-section-title">Motif de consultation</div>
                        <p>Suivi habituel d'un diabète de type 2 évoluant depuis 12 ans.<br />Diabète mal équilibré, prise de poids récente.</p>
                    </div>
                    <div class="fiche-section">
                        <div class="fiche-section-title">Éléments de contexte</div>
                        <ul>
                            <li>Difficulté à gérer l'alimentation, grignotage lié au stress</li>
                            <li>Sédentarité, fatigue morale liée à la charge familiale et professionnelle</li>
                        </ul>
                    </div>
                `
            }
        };

        /* ── State ── */
        let inCall = false, isSpeaking = false, isProcessing = false;
        let mediaRecorder = null, audioChunks = [], silenceLoop = null;
        let audioStream = null, audioContext = null, analyser = null;
        let audioQueue = [], isPlaying = false;

        /* ── Elements ── */
        const inputEl     = document.getElementById("user-input");
        const sendBtn     = document.getElementById("send-btn");
        const micBtn      = document.getElementById("mic-btn");
        const iconCall    = document.getElementById("icon-call");
        const iconEndCall = document.getElementById("icon-endcall");
        const ringOuter   = document.getElementById("ring-outer");
        const statusLabel = document.getElementById("status-label");
        const thinkingOvl = document.getElementById("thinking-overlay");
        const interimEl   = document.getElementById("interim");
        const toast       = document.getElementById("toast");

        /* ── UI helpers ── */
        function showToast(msg) { toast.textContent = msg; toast.classList.add("show"); setTimeout(() => toast.classList.remove("show"), 3500); }
        function setStatus(text, active = false) { statusLabel.textContent = text; statusLabel.classList.toggle("active", active); }
        function setThinking(on) { thinkingOvl.classList.toggle("show", on); if (on) setStatus("réfléchit…", true); }
        function setSpeaking(on) { isSpeaking = on; ringOuter.classList.toggle("speaking", on); if (on) { setStatus("parle…", true); setInterim(""); } }
        function setInterim(text) { interimEl.textContent = text; interimEl.classList.toggle("show", !!text); }

        /* ── Page transitions ── */
        function hidePage(id, then) {
            const el = document.getElementById(id);
            el.classList.add("hidden");
            el.addEventListener("animationend", () => {
                el.style.display = "none";
                el.classList.remove("hidden");
                if (then) then();
            }, { once: true });
        }
        function showPage(id) {
            const el = document.getElementById(id);
            el.style.display = "flex";
            el.scrollTop = 0;
        }

        /* ── Preload an image, resolves once loaded (or on error, so we never hang) ── */
        function preloadImage(src) {
            return new Promise(resolve => {
                const img = new Image();
                img.onload  = resolve;
                img.onerror = resolve;
                img.src = src;
            });
        }

        /* ── Load module buttons ── */
        async function loadModules() {
            const grid = document.getElementById("interview-grid");
            grid.innerHTML = `<div style="font-family:'DM Mono',monospace;font-size:.72rem;color:var(--muted)">Chargement…</div>`;
            try {
                const res  = await fetch("/modules");
                const list = await res.json();
                grid.innerHTML = "";
                list.forEach(({ key, label }) => {
                    const btn = document.createElement("button");
                    btn.className    = "interview-btn";
                    btn.dataset.type = key;
                    btn.innerHTML    = `<span class="ib-label">${label}</span>`;
                    btn.addEventListener("click", () => {
                        document.querySelectorAll(".interview-btn").forEach(b => b.classList.remove("selected"));
                        btn.classList.add("selected");
                        selectedInterviewType = key;
                        document.getElementById("choice-error").textContent = "";
                    });
                    grid.appendChild(btn);
                });
            } catch {
                grid.innerHTML = `<div style="color:var(--red);font-family:'DM Mono',monospace;font-size:.72rem">Erreur de chargement.</div>`;
            }
        }

        /* ── Populate the patient fiche based on selected type ── */
        function populatePatientFiche(type) {
            const fiche = PATIENT_FICHES[type];
            const container = document.getElementById("patient-fiche-content");
            if (!fiche) {
                container.innerHTML = `<div class="fiche-header"><div class="fiche-title">Fiche indisponible</div></div>`;
                return;
            }
            container.innerHTML = fiche.html;
            document.getElementById("patient-header-name").textContent = fiche.name;
            document.getElementById("patient-portrait").src = fiche.portrait;
            document.getElementById("patient-portrait").alt = fiche.name;
        }

        /* ── Step 1 (choice) → Step 2 (fiche) ── */
        document.getElementById("next-btn").addEventListener("click", async () => {
            if (!selectedInterviewType) {
                document.getElementById("choice-error").textContent = "Veuillez choisir un type d'entretien.";
                return;
            }
            const nextBtn      = document.getElementById("next-btn");
            const nextBtnLabel = document.getElementById("next-btn-label");
            const nextBtnSpinner = document.getElementById("next-btn-spinner");

            nextBtn.disabled = true;
            nextBtnLabel.textContent = "Chargement…";
            nextBtnSpinner.classList.add("show");

            const fiche = PATIENT_FICHES[selectedInterviewType];
            if (fiche) await preloadImage(fiche.portrait);

            populatePatientFiche(selectedInterviewType);
            hidePage("choice-page", () => showPage("patient-page"));

            nextBtn.disabled = false;
            nextBtnLabel.textContent = "Voir la fiche patient →";
            nextBtnSpinner.classList.remove("show");
        });

        /* ── Step 2 (fiche) → Chat ── */
        document.getElementById("start-btn").addEventListener("click", async () => {
            const loadingEl = document.getElementById("start-loading");
            const startBtn  = document.getElementById("start-btn");
            loadingEl.style.display = "block";
            startBtn.disabled = true;
            try {
                const res = await fetch("/start_session", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ session_id: SESSION_ID, interview_type: selectedInterviewType })
                });
                if (!res.ok) {
                    const err = await res.json();
                    showToast(err.error || "Erreur serveur.");
                    return;
                }
                hidePage("patient-page");
            } catch {
                showToast("Erreur réseau, réessayez.");
            } finally {
                loadingEl.style.display = "none";
                startBtn.disabled = false;
            }
        });

        /* ── Back button ── */
        document.getElementById("back-btn").addEventListener("click", () => {
            if (inCall) stopCall();
            fetch("/reset", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ session_id: SESSION_ID })
            });
            selectedInterviewType = null;
            showPage("choice-page");
            loadModules();
        });

        /* ── Transcript ── */
        async function showTranscript() {
            try {
                const res = await fetch("/end_session", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ session_id: SESSION_ID })
                });
                if (!res.ok) { showToast("Impossible de récupérer le transcript."); return; }
                lastTranscriptText = await res.text();
            } catch {
                showToast("Erreur réseau — transcript non disponible.");
                return;
            }
            document.getElementById("transcript-box").textContent  = lastTranscriptText;
            document.getElementById("eval-card").style.display     = "none";
            document.getElementById("eval-loading").style.display  = "none";
            document.getElementById("eval-feedback").textContent   = "";
            showPage("transcript-page");
        }

        function triggerDownload() {
            if (!lastTranscriptText) return;
            const blob = new Blob([lastTranscriptText], { type: "text/plain;charset=utf-8" });
            const url  = URL.createObjectURL(blob);
            const a    = document.createElement("a");
            a.href = url; a.download = "transcript.txt"; a.click();
            URL.revokeObjectURL(url);
        }

        document.getElementById("download-btn").addEventListener("click", triggerDownload);

        document.getElementById("restart-btn").addEventListener("click", () => {
            fetch("/reset", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ session_id: SESSION_ID })
            });
            selectedInterviewType = null;
            lastTranscriptText    = "";
            hidePage("transcript-page", () => { showPage("choice-page"); loadModules(); });
        });

        /* ── Evaluation ── */
        document.getElementById("evaluate-btn").addEventListener("click", async () => {
            const btn       = document.getElementById("evaluate-btn");
            const loadingEl = document.getElementById("eval-loading");
            btn.disabled = true;
            loadingEl.style.display = "block";
            document.getElementById("eval-card").style.display   = "none";
            document.getElementById("eval-feedback").textContent = "";

            try {
                const controller = new AbortController();
                const timeoutId  = setTimeout(() => controller.abort(), 110000);

                const res = await fetch("/evaluate", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ session_id: SESSION_ID }),
                    signal: controller.signal
                });
                clearTimeout(timeoutId);

                const data = await res.json();
                if (data.error) { showToast("Erreur : " + data.error); return; }

                document.getElementById("eval-feedback").textContent = data.feedback;
                document.getElementById("eval-card").style.display   = "block";

                setTimeout(() => {
                    document.getElementById("eval-card").scrollIntoView({ behavior: "smooth", block: "start" });
                }, 100);

            } catch (e) {
                if (e.name === "AbortError") {
                    showToast("L'évaluation prend trop de temps — réessayez.");
                } else {
                    showToast("Erreur réseau — évaluation impossible.");
                }
            } finally {
                btn.disabled = false;
                loadingEl.style.display = "none";
            }
        });

        /* ── Audio queue ── */
        function enqueueAndPlay(blob) {
            audioQueue.push(blob);
            if (!isPlaying) playNext();
        }
        function playNext() {
            if (audioQueue.length === 0) { setSpeaking(false); resumeListening(); return; }
            isPlaying = true;
            const blob  = audioQueue.shift();
            const url   = URL.createObjectURL(blob);
            const audio = new Audio(url);
            audio.onended = () => { URL.revokeObjectURL(url); isPlaying = false; playNext(); };
            audio.onerror = () => { URL.revokeObjectURL(url); isPlaying = false; playNext(); };
            audio.play().catch(() => { isPlaying = false; playNext(); });
        }

        /* ── Send message ── */
        async function sendMessage(text) {
            text = (text || inputEl.value).trim();
            if (!text || isProcessing) return;
            isProcessing = true;
            inputEl.value = "";
            setInterim(""); setThinking(true);
            audioQueue = []; isPlaying = false;

            try {
                const res = await fetch("/chat_stream", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ session_id: SESSION_ID, message: text })
                });
                if (!res.ok) { setThinking(false); resumeListening(); showToast("Erreur serveur."); return; }

                const reader  = res.body.getReader();
                const decoder = new TextDecoder();
                let buffer = "", currentChunks = [];

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split("\n");
                    buffer = lines.pop();
                    for (const line of lines) {
                        if (!line.trim()) continue;
                        let msg; try { msg = JSON.parse(line); } catch { continue; }
                        if      (msg.type === "sentence_start") { setThinking(false); setSpeaking(true); currentChunks = []; }
                        else if (msg.type === "audio")          { currentChunks.push(Uint8Array.from(atob(msg.data), c => c.charCodeAt(0))); }
                        else if (msg.type === "sentence_end")   { if (currentChunks.length) enqueueAndPlay(new Blob(currentChunks, { type: "audio/ogg; codecs=opus" })); currentChunks = []; }
                    }
                }
            } catch { setThinking(false); resumeListening(); showToast("Erreur réseau."); }
            finally  { isProcessing = false; }
        }

        /* ── Voice recording ── */
        const SILENCE_THRESHOLD = 4;
        const SILENCE_DURATION  = 3000;

        function startListening() {
            if (!inCall || isSpeaking || isProcessing) return;
            setInterim("…"); setStatus("écoute…", true);
            audioChunks = []; mediaRecorder.start();
            const dataArray = new Uint8Array(analyser.fftSize);
            let silentMs = 0, hasVoice = false, smoothedRms = 0;

            silenceLoop = setInterval(() => {
                if (!inCall || isSpeaking) { clearInterval(silenceLoop); return; }
                analyser.getByteTimeDomainData(dataArray);
                let sum = 0;
                for (let i = 0; i < dataArray.length; i++) { const v = dataArray[i] - 128; sum += v * v; }
                const rms = Math.sqrt(sum / dataArray.length);
                smoothedRms = smoothedRms * 0.85 + rms * 0.15;

                if (smoothedRms > SILENCE_THRESHOLD) {
                    hasVoice = true; silentMs = 0; setInterim("🎤");
                } else if (hasVoice) {
                    silentMs += 100;
                    if (silentMs >= SILENCE_DURATION) { clearInterval(silenceLoop); mediaRecorder.stop(); }
                }
            }, 100);
        }

        function resumeListening() {
            if (!inCall) { setStatus("en attente"); return; }
            setTimeout(startListening, 400);
        }

        /* ── Call control ── */
        async function startCall() {
            try {
                audioStream  = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioContext = new AudioContext();
                const source = audioContext.createMediaStreamSource(audioStream);
                analyser     = audioContext.createAnalyser(); analyser.fftSize = 2048;
                source.connect(analyser);
                mediaRecorder = new MediaRecorder(audioStream);
                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
                mediaRecorder.onstop = async () => {
                    if (!inCall || !audioChunks.length) return;
                    const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType }); audioChunks = [];
                    setInterim("…"); setStatus("transcription…", true);
                    try {
                        const res  = await fetch("/transcribe", { method: "POST", headers: { "Content-Type": "application/octet-stream" }, body: blob });
                        const data = await res.json();
                        if (data.text) { setInterim(data.text); await sendMessage(data.text); }
                        else resumeListening();
                    } catch { showToast("Erreur transcription."); resumeListening(); }
                };
                inCall = true;
                micBtn.classList.add("in-call");
                iconCall.style.display = "none"; iconEndCall.style.display = "";
                startListening();
            } catch { showToast("Microphone non accessible."); }
        }

        function stopCall() {
            inCall = false;
            clearInterval(silenceLoop);
            if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
            if (audioStream)  audioStream.getTracks().forEach(t => t.stop());
            if (audioContext) audioContext.close();
            audioChunks = []; audioQueue = []; isProcessing = false; isPlaying = false;
            micBtn.classList.remove("in-call");
            iconCall.style.display = ""; iconEndCall.style.display = "none";
            setSpeaking(false); setThinking(false); setInterim(""); setStatus("en attente");
            showTranscript();
        }

        /* ── Events ── */
        sendBtn.addEventListener("click", () => sendMessage());
        inputEl.addEventListener("keydown", e => { if (e.key === "Enter") sendMessage(); });
        micBtn.addEventListener("click", () => { if (inCall) stopCall(); else startCall(); });

        /* ── Init ── */
        (async function init() {
            await loadModules();
            document.getElementById("page-loader").classList.add("hidden");
            setTimeout(() => { document.getElementById("page-loader").style.display = "none"; }, 400);
            showPage("choice-page");
        })();
    </script>
</body>
</html>
