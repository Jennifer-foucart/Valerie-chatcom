<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Valérie — Chatcom</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --ink:       #1a1a2e;
      --paper:     #f5f0e8;
      --cream:     #ede8dc;
      --accent:    #8b5e3c;
      --accent-lt: #c49a6c;
      --muted:     #9a8f82;
      --border:    rgba(139,94,60,.18);
      --red:       #ef4444;
      --green:     #7cba7c;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Cormorant Garamond', Georgia, serif;
      background: var(--paper);
      color: var(--ink);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      width: 100%; max-width: 520px;
      padding: 28px 28px 18px;
      display: flex; align-items: baseline; gap: 12px;
      border-bottom: 1px solid var(--border);
    }
    header h1 {
      font-size: 2rem; font-weight: 300;
      letter-spacing: .04em; color: var(--accent);
    }
    header span {
      font-family: 'DM Mono', monospace; font-size: .7rem;
      color: var(--muted); letter-spacing: .12em; text-transform: uppercase;
    }
    .status-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--green); margin-left: auto; flex-shrink: 0;
      box-shadow: 0 0 0 3px rgba(124,186,124,.2);
    }

    /* ── Portrait ── */
    #portrait-wrap {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
    }

    .portrait-frame { position: relative; }

    .ring {
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }
    .ring-outer {
      width: 260px; height: 260px;
      border: 2px solid var(--border);
      transition: border-color .3s;
    }
    .ring-outer.speaking {
      border-color: var(--accent-lt);
      animation: speakring 1.6s ease infinite;
    }
    @keyframes speakring {
      0%,100% { box-shadow: 0 0 0 0    rgba(196,154,108,.4); }
      50%      { box-shadow: 0 0 0 14px rgba(196,154,108,0);  }
    }
    .ring-inner {
      width: 240px; height: 240px;
      background: var(--cream);
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .ring-inner img {
      width: 100%; height: 100%;
      object-fit: cover; object-position: center top; display: block;
    }

    /* ── Thinking dots ── */
    #thinking-overlay {
      display: none; position: absolute;
      bottom: 18px; left: 50%; transform: translateX(-50%);
      gap: 6px; align-items: center; justify-content: center;
    }
    #thinking-overlay.show { display: flex; }
    .tdot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--accent-lt); animation: bounce .9s ease infinite;
    }
    .tdot:nth-child(2) { animation-delay: .15s; }
    .tdot:nth-child(3) { animation-delay: .30s; }
    @keyframes bounce {
      0%,80%,100% { transform: translateY(0); }
      40%          { transform: translateY(-5px); }
    }

    /* ── Status label ── */
    #status-label {
      font-family: 'DM Mono', monospace;
      font-size: .72rem; letter-spacing: .14em; text-transform: uppercase;
      color: var(--muted); min-height: 1.2em; transition: color .3s;
    }
    #status-label.active { color: var(--accent-lt); }

    /* ── Live interim transcript ── */
    #interim {
      font-family: 'Cormorant Garamond', serif;
      font-size: .95rem; font-style: italic;
      color: var(--muted); min-height: 1.4em;
      max-width: 400px; text-align: center;
      opacity: 0; transition: opacity .2s;
    }
    #interim.show { opacity: 1; }

    /* ── STT warning ── */
    #stt-warning {
      display: none; font-family: 'DM Mono', monospace;
      font-size: .68rem; color: var(--red);
      text-align: center; max-width: 320px; line-height: 1.5;
    }

    /* ── Input bar ── */
    #input-bar {
      width: 100%; max-width: 520px;
      padding: 16px 28px 28px;
      display: flex; gap: 10px; align-items: center;
      border-top: 1px solid var(--border); background: var(--paper);
    }
    #user-input {
      flex: 1; font-family: 'Cormorant Garamond', serif;
      font-size: 1.05rem; background: var(--cream);
      border: 1.5px solid var(--border); border-radius: 40px;
      padding: 10px 20px; outline: none; color: var(--ink);
      transition: border-color .2s;
    }
    #user-input::placeholder { color: var(--muted); }
    #user-input:focus { border-color: var(--accent-lt); }

    .btn-icon {
      width: 44px; height: 44px; border-radius: 50%;
      border: 1.5px solid var(--border); background: var(--cream);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background .2s, border-color .2s, transform .1s; flex-shrink: 0;
    }
    .btn-icon:hover  { background: #dde8f5; border-color: var(--accent-lt); }
    .btn-icon:active { transform: scale(.93); }
    .btn-icon svg    { pointer-events: none; }
    .btn-icon:disabled { opacity: .4; cursor: default; }

    #mic-btn.in-call {
      background: #fee2e2; border-color: var(--red);
      animation: callpulse 1.4s ease infinite;
    }
    @keyframes callpulse {
      0%,100% { box-shadow: 0 0 0 0   rgba(239,68,68,.35); }
      50%      { box-shadow: 0 0 0 9px rgba(239,68,68,0);   }
    }

    /* ── Toast ── */
    #toast {
      position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
      background: #3b0a0a; color: #fecaca;
      font-family: 'DM Mono', monospace; font-size: .75rem;
      padding: 8px 20px; border-radius: 8px;
      opacity: 0; pointer-events: none; transition: opacity .3s;
    }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>

<header>
  <h1>Valérie</h1>
  <span>Chatcom · FR</span>
  <div class="status-dot"></div>
</header>

<div id="portrait-wrap">
  <div class="portrait-frame">
    <div class="ring ring-outer" id="ring-outer">
      <div class="ring ring-inner">
        <img src="/static/valerie.jpg" alt="Valérie"/>
      </div>
    </div>
    <div id="thinking-overlay">
      <span class="tdot"></span><span class="tdot"></span><span class="tdot"></span>
    </div>
  </div>

  <div id="status-label">en attente</div>
  <div id="interim"></div>
  <div id="stt-warning">⚠ La reconnaissance vocale nécessite Chrome ou Edge</div>
</div>

<div id="input-bar">
  <button class="btn-icon" id="mic-btn" title="Appel en direct">
    <svg id="icon-call" width="18" height="18" viewBox="0 0 24 24" fill="none"
         stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07
               A19.5 19.5 0 0 1 4.08 12a19.79 19.79 0 0 1-3.07-8.67
               A2 2 0 0 1 3 1.18h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81
               a2 2 0 0 1-.45 2.11L7.09 8.91a16 16 0 0 0 6 6l1.27-1.27
               a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
    </svg>
    <svg id="icon-endcall" width="18" height="18" viewBox="0 0 24 24" fill="none"
         stroke="var(--red)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
         style="display:none">
      <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07
               A19.5 19.5 0 0 1 4.08 12a19.79 19.79 0 0 1-3.07-8.67
               A2 2 0 0 1 3 1.18h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81
               a2 2 0 0 1-.45 2.11L7.09 8.91a16 16 0 0 0 6 6l1.27-1.27
               a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
      <line x1="1" y1="1" x2="23" y2="23" stroke="var(--red)" stroke-width="1.8"/>
    </svg>
  </button>

  <input type="text" id="user-input" placeholder="Écrivez un message…" autocomplete="off"/>

  <button class="btn-icon" id="send-btn" title="Envoyer">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
         stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <line x1="22" y1="2" x2="11" y2="13"/>
      <polygon points="22 2 15 22 11 13 2 9 22 2"/>
    </svg>
  </button>
</div>

<div id="toast"></div>

<script>
/* ── State ── */
let inCall       = false;
let recognition  = null;
let ttsAudio     = null;
let isSpeaking   = false;   // true while TTS audio is playing
let isProcessing = false;   // true while waiting for Mistral + TTS

/* ── Elements ── */
const inputEl     = document.getElementById("user-input");
const sendBtn     = document.getElementById("send-btn");
const micBtn      = document.getElementById("mic-btn");
const iconCall    = document.getElementById("icon-call");
const iconEndCall = document.getElementById("icon-endcall");
const ringOuter   = document.getElementById("ring-outer");
const statusLabel = document.getElementById("status-label");
const thinkingOvl = document.getElementById("thinking-overlay");
const interimEl   = document.getElementById("interim");
const sttWarning  = document.getElementById("stt-warning");
const toast       = document.getElementById("toast");

/* ── Web Speech API check ── */
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SpeechRecognition) {
  micBtn.disabled = true;
  sttWarning.style.display = "block";
}

/* ── UI helpers ── */
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 3500);
}

function setStatus(text, active = false) {
  statusLabel.textContent = text;
  statusLabel.classList.toggle("active", active);
}

function setThinking(on) {
  thinkingOvl.classList.toggle("show", on);
  if (on) setStatus("réfléchit…", true);
}

function setSpeaking(on) {
  isSpeaking = on;
  ringOuter.classList.toggle("speaking", on);
  if (on) {
    setStatus("parle…", true);
    setInterim("");
  }
}

function setInterim(text) {
  interimEl.textContent = text;
  interimEl.classList.toggle("show", !!text);
}

/* ── Resume mic after TTS ends ── */
function resumeRecognition() {
  if (!inCall) { setStatus("en attente"); return; }
  setStatus("écoute…", true);
  try { recognition.start(); } catch(_) {}
}

/* ── TTS: server returns WAV, browser plays it ── */
async function playTTS(text) {
  setSpeaking(true);
  // Stop mic while Valérie is speaking — mirrors original pause_microphone()
  if (recognition) recognition.abort();

  try {
    const res = await fetch("/tts", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text })
    });

    if (!res.ok) { setSpeaking(false); resumeRecognition(); return; }

    const blob = await res.blob();
    const url  = URL.createObjectURL(blob);

    if (ttsAudio) { ttsAudio.pause(); ttsAudio = null; }
    ttsAudio = new Audio(url);

    ttsAudio.onended = () => {
      setSpeaking(false);
      URL.revokeObjectURL(url);
      resumeRecognition();   // mirrors original resume_microphone()
    };

    ttsAudio.onerror = () => {
      setSpeaking(false);
      resumeRecognition();
    };

    ttsAudio.play();

  } catch (e) {
    setSpeaking(false);
    resumeRecognition();
    console.warn("TTS error:", e);
  }
}

/* ── Send recognised/typed text to Mistral ── */
async function sendMessage(text) {
  text = (text || inputEl.value).trim();
  if (!text)         return;
  if (isProcessing)  return;   // drop duplicate firings
  isProcessing = true;

  inputEl.value = "";
  setInterim("");
  setThinking(true);

  try {
    const res  = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text })
    });
    const data = await res.json();
    setThinking(false);

    if (data.error) {
      showToast("Erreur : " + data.error);
      resumeRecognition();
      return;
    }

    await playTTS(data.reply);

  } catch (e) {
    setThinking(false);
    resumeRecognition();
    showToast("Erreur réseau.");
  } finally {
    isProcessing = false;
  }
}

/* ── Speech recognition — mirrors original Vosk continuous loop ──
   continuous: true  → keeps stream open, never cuts mid-sentence
   interimResults    → shows live transcript while user speaks
   isFinal           → fires exactly once per utterance on natural pause
                       (equivalent to Vosk's AcceptWaveform returning true)
── */
function buildRecognition() {
  const r = new SpeechRecognition();
  r.lang           = "fr-FR";
  r.continuous     = true;
  r.interimResults = true;

  r.onresult = (e) => {
    let interim = "";
    let final   = "";

    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) {
        final += e.results[i][0].transcript;
      } else {
        interim += e.results[i][0].transcript;
      }
    }

    // Show live transcript as user speaks
    if (interim) setInterim(interim);

    // Send only on final result and only if not already processing
    if (final.trim() && !isProcessing) {
      setInterim("");
      sendMessage(final.trim());
    }
  };

  r.onerror = (e) => {
    if (e.error === "no-speech") return;   // normal silence
    if (e.error === "aborted")   return;   // we aborted intentionally (during TTS)
    showToast("Erreur micro : " + e.error);
  };

  r.onend = () => {
    // Auto-restart as long as call is active and Valérie isn't speaking
    // Mirrors original resume_microphone() being called after each chunk
    if (inCall && !isSpeaking) {
      try { r.start(); } catch(_) {}
    }
  };

  return r;
}

/* ── Call control ── */
function startCall() {
  recognition = buildRecognition();
  try {
    recognition.start();
  } catch (e) {
    showToast("Microphone non accessible.");
    return;
  }
  inCall = true;
  micBtn.classList.add("in-call");
  iconCall.style.display    = "none";
  iconEndCall.style.display = "";
  setStatus("écoute…", true);
}

function stopCall() {
  inCall       = false;
  isProcessing = false;
  if (recognition) { recognition.abort(); recognition = null; }
  if (ttsAudio)    { ttsAudio.pause(); ttsAudio = null; }
  setSpeaking(false);
  setThinking(false);
  setInterim("");
  micBtn.classList.remove("in-call");
  iconCall.style.display    = "";
  iconEndCall.style.display = "none";
  setStatus("en attente");
}

function toggleCall() {
  if (inCall) stopCall();
  else        startCall();
}

/* ── Events ── */
sendBtn.addEventListener("click", () => sendMessage());
inputEl.addEventListener("keydown", e => { if (e.key === "Enter") sendMessage(); });
micBtn.addEventListener("click", toggleCall);
</script>
</body>
</html>
